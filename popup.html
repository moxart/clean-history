<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, Tahoma, sans-serif; width: 300px; margin: 0; padding: 16px; background: #f7f7f8; color: #222; font-size: 13px; }
    html[lang="fa"] body { font-family: Tahoma, "Vazirmatn", sans-serif; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h1 { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 8px; }
    h1 img { width: 20px; height: 20px; }
    .tabs { display: flex; background: #e3e3e6; border-radius: 6px; padding: 2px; }
    .tabs button { width: auto; padding: 3px 10px; background: transparent; color: #444; border-radius: 4px; font-size: 12px; }
    .tabs button.active { background: #fff; color: #222; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .stat { background: #fff; border-radius: 8px; padding: 10px; margin-bottom: 12px; border: 1px solid #e3e3e6; }
    .stat b { font-size: 18px; }
    button { width: 100%; padding: 9px; border: 0; border-radius: 6px; background: #2f6fed; color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    button.secondary { background: #e3e3e6; color: #222; margin-top: 6px; }
    textarea { width: 100%; box-sizing: border-box; height: 90px; direction: ltr; font-family: monospace; font-size: 12px; border: 1px solid #ccc; border-radius: 6px; padding: 6px; }
    label { display: block; margin: 14px 0 4px; }
    #msg { min-height: 16px; margin-top: 8px; color: #1a7f37; }
  </style>
</head>
<body>
  <header>
    <h1><img src="icons/icon32.png" alt=""><span data-i18n="title"></span></h1>
    <div class="tabs">
      <button data-lang="en">EN</button>
      <button data-lang="fa">فا</button>
    </div>
  </header>
  <div class="row">
    <span data-i18n="enabled"></span>
    <input type="checkbox" id="enabled">
  </div>
  <div class="stat">
    <span data-i18n="removed"></span> <b id="count">0</b><br>
    <small><span data-i18n="lastScan"></span> <span id="lastScan">—</span></small>
  </div>
  <button id="scan" data-i18n="scan"></button>

  <label for="custom" data-i18n="customLabel"></label>
  <textarea id="custom" placeholder="example.com"></textarea>
  <button id="save" class="secondary" data-i18n="save"></button>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
